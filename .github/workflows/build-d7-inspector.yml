name: Build D7 Inspector

on:
  push:
    branches: [main]
    paths:
      - 'android/d7inspector/**'
      - 'android/settings.gradle.kts'
      - 'android/build.gradle.kts'
      - '.github/workflows/build-d7-inspector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android :d7inspector:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d7-inspector-debug
          path: android/d7inspector/build/outputs/apk/debug/d7inspector-debug.apk
          if-no-files-found: error
